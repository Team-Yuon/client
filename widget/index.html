<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUON Chat Widget - Development</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .dev-panel {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      color: #1f2937;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .info {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .info strong {
      display: block;
      color: #1e40af;
      margin-bottom: 8px;
    }

    .info code {
      background: #dbeafe;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #1e40af;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button.secondary {
      background: #e5e7eb;
      color: #374151;
    }

    button.secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="dev-panel">
    <h1>🚀 YUON Chat Widget</h1>
    <p>개발 모드로 실행 중입니다. 아래 버튼으로 위젯을 테스트하세요.</p>

    <div class="info">
      <strong>💡 개발 서버 정보</strong>
      <div>API: <code>http://localhost:8080/api/v1</code></div>
      <div>WebSocket: <code>ws://localhost:8080/api/v1/ws</code></div>
    </div>

    <button onclick="testWidget()">위젯 초기화</button>
    <button class="secondary" onclick="destroyWidget()">위젯 제거</button>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>

  <script>
    function testWidget() {
      if (window.YuonChat) {
        window.YuonChat.init({
          apiUrl: 'http://localhost:8080/api/v1',
          wsUrl: 'ws://localhost:8080/api/v1/ws',
          theme: 'dark',
          position: 'right',
          primaryColor: '#3b82f6',
          welcomeMessage: '안녕하세요! YUON 챗봇입니다. 무엇을 도와드릴까요?'
        })
        console.log('[Dev] Widget initialized')
      }
    }

    function destroyWidget() {
      if (window.YuonChat) {
        window.YuonChat.destroy()
        console.log('[Dev] Widget destroyed')
      }
    }

    // 자동 초기화
    setTimeout(() => {
      testWidget()
    }, 1000)
  </script>
</body>
</html>
